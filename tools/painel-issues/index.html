<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuvio Legacy - issues e roadmap</title>
<style>
:root{--bg:#0e1013;--card:#161a1f;--card2:#1d2228;--line:#2a313a;--tx:#e6e9ed;--mut:#8a94a1;--ac:#7c9cff;--ac2:#3b4f94;--ok:#58c08a;--warn:#e0b24c;--bad:#e5736f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
header{padding:20px 16px 12px;border-bottom:1px solid var(--line)}
h1{margin:0 0 4px;font-size:20px;font-weight:650;display:flex;align-items:center;gap:10px}
h1 svg{width:22px;height:22px;color:var(--ac);flex:none}
.sub{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
main{max-width:1280px;margin:0 auto;padding:16px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:28px 0 10px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.kpi:hover,.kpi.on{border-color:var(--ac)}
.kpi b{display:block;font-size:26px;font-weight:650;line-height:1.1}
.kpi span{color:var(--mut);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 40px;gap:8px;align-items:center;width:100%;background:none;border:0;color:inherit;font:inherit;padding:4px 2px;border-radius:6px;cursor:pointer;text-align:left}
.bar:hover{background:var(--card2)}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ac2);border-radius:5px}
.bar.on .t i{background:var(--ac)}.bar.on .n{color:var(--ac);font-weight:600}
.bar .c{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.rel h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rel .sit{color:var(--mut);font-size:12px;margin:2px 0 6px}
.rel .desc{color:var(--mut);font-size:12.5px;margin:0 0 8px}
.it{border-top:1px solid var(--line);padding:8px 0}
.it b{display:block}
.it p{margin:3px 0;color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);margin:2px 3px 0 0;overflow-wrap:anywhere}
.tag.ac{color:var(--ac);border-color:var(--ac2)}.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.lst>div{border-top:1px solid var(--line);padding:9px 0}.lst>div:first-child{border-top:0}
.lst p{margin:3px 0;overflow-wrap:anywhere}.lst .rec{color:var(--mut)}
.q{font-style:normal}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input,select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;min-width:0}
input[type=search]{flex:1 1 220px}
.chip{background:var(--card2);color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{color:var(--bg);background:var(--ac);border-color:var(--ac)}
.btn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.btn:hover{color:var(--tx);border-color:var(--ac)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:78vh;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--card2);cursor:pointer;white-space:nowrap;font-size:12px;color:var(--mut);user-select:none;z-index:1}
th.s{color:var(--ac)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--card)}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
td.tit{min-width:240px;overflow-wrap:anywhere}
tr.det td{background:var(--card);padding:12px 16px}
.det dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:6px 12px}
.det dt{color:var(--mut)}.det dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
@media(max-width:600px){.det dl{grid-template-columns:1fr}}
.cnt{color:var(--mut);font-size:12.5px;margin:6px 0}
.vazio{color:var(--mut);padding:8px 0}
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"/><path d="M8 15l3-4 3 2 5-6"/></svg><span>Nuvio Legacy — issues e roadmap</span></h1>
  <div class="sub" id="meta">carregando...</div>
</header>
<main id="app"></main>
<script>
"use strict";
function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function safeUrl(u) { return /^https?:\/\//.test(u || "") ? u : null; }
function sv(v) { return v == null || v === "" ? "" : String(v); }

var D, ITENS, BY = {}, F = { q: "", plat: "", status: "", alvo: "", estado: "", extra: "", sort: "numero", dir: -1 };
var ALVO_ORDEM = ["2.0.4", "2.0.5", "2.1", "2.2", "futuro", "nao vamos fazer", "ja-lancada"];
var SEM_ALVO = "(sem alvo)";

function alvoDe(i) { return i.alvo ? String(i.alvo) : SEM_ALVO; }
function platDe(i) {
  var p = sv(i.plataforma);
  if (!p || p === "?") return "desconhecida";
  if (/^samsung/i.test(p)) return "Samsung";
  if (/^lg/i.test(p)) return "LG";
  if (/^android/i.test(p)) return "Android";
  if (p === "all") return "todas";
  return "outras";
}
function aberta(i) { return i.estado_github === "aberta"; }
function proximaVersao() {
  var abertas = ITENS.filter(aberta);
  for (var k = 0; k < ALVO_ORDEM.length - 3; k++) {
    if (abertas.some(function (i) { return i.alvo === ALVO_ORDEM[k]; })) return ALVO_ORDEM[k];
  }
  return "2.0.4";
}
function sortAlvos(keys) {
  return keys.sort(function (a, b) {
    var ia = ALVO_ORDEM.indexOf(a), ib = ALVO_ORDEM.indexOf(b);
    if (a === SEM_ALVO) ia = 99; if (b === SEM_ALVO) ib = 99;
    if (ia < 0) ia = 50; if (ib < 0) ib = 50;
    return ia - ib || a.localeCompare(b);
  });
}
function count(fn) {
  var m = {};
  ITENS.forEach(function (i) { var k = fn(i); m[k] = (m[k] || 0) + 1; });
  return m;
}

function issueLink(n) {
  var it = BY[n], u = it && safeUrl(it.url);
  var t = "#" + n + (it ? "" : "");
  var a = u ? el("a", { href: u, target: "_blank", rel: "noopener", text: t, title: it.titulo || "" }) : el("span", { text: t });
  return a;
}

function setFilter(k, v) {
  F[k] = (F[k] === v) ? "" : v;
  renderBars(); renderTools(); renderTable();
  document.getElementById("tabela").scrollIntoView({ behavior: "smooth", block: "start" });
}

function kpi(label, val, onclick, key) {
  return el("button", { class: "kpi" + (F.extra === key && key ? " on" : ""), onclick: onclick, type: "button" }, [el("b", { text: String(val) }), el("span", { text: label })]);
}

function renderKpis() {
  var box = document.getElementById("kpis"); box.textContent = "";
  var prox = proximaVersao();
  var abertas = ITENS.filter(aberta);
  var saiProx = abertas.filter(function (i) { return i.alvo === prox; }).length;
  var semResp = abertas.filter(function (i) { return i.ultima_resposta && i.ultima_resposta.nos === false; }).length;
  var log = ITENS.filter(function (i) { return i.status === "precisa-log"; }).length;
  var ex = function (k, estado) { return function () { F.extra = k; F.estado = estado || ""; F.alvo = ""; F.status = ""; F.plat = ""; F.q = ""; renderAll(); document.getElementById("tabela").scrollIntoView({ behavior: "smooth" }); }; };
  box.appendChild(kpi("total de issues", ITENS.length, ex(""), ""));
  box.appendChild(kpi("abertas no GitHub", abertas.length, ex("", "aberta"), "ab"));
  box.appendChild(kpi("sai na proxima versao (" + prox + ")", saiProx, function () { F.extra = ""; F.estado = "aberta"; F.alvo = prox; F.status = ""; F.plat = ""; F.q = ""; renderAll(); document.getElementById("tabela").scrollIntoView({ behavior: "smooth" }); }, "px"));
  box.appendChild(kpi("sem resposta nossa", semResp, ex("semresp", "aberta"), "semresp"));
  box.appendChild(kpi("aguardando log", log, function () { F.extra = ""; F.estado = ""; F.alvo = ""; F.status = "precisa-log"; F.plat = ""; F.q = ""; renderAll(); document.getElementById("tabela").scrollIntoView({ behavior: "smooth" }); }, "log"));
}

function barBlock(titulo, map, keys, campo) {
  var max = Math.max.apply(null, keys.map(function (k) { return map[k]; }).concat([1]));
  var p = el("div", { class: "panel" }, [el("div", { class: "sub", text: titulo })]);
  keys.forEach(function (k) {
    p.appendChild(el("button", { class: "bar" + (F[campo] === k ? " on" : ""), type: "button", onclick: function () { setFilter(campo, k); } }, [
      el("span", { class: "n", text: k, title: k }),
      el("span", { class: "t" }, [el("i", { style: "width:" + Math.round(map[k] / max * 100) + "%" })]),
      el("span", { class: "c", text: String(map[k]) })
    ]));
  });
  return p;
}
function renderBars() {
  var box = document.getElementById("bars"); box.textContent = "";
  var ma = count(alvoDe), ms = count(function (i) { return sv(i.status) || "(sem status)"; });
  var ks = Object.keys(ms).sort(function (a, b) { return ms[b] - ms[a]; });
  box.appendChild(barBlock("Por alvo (release)", ma, sortAlvos(Object.keys(ma)), "alvo"));
  box.appendChild(barBlock("Por status", ms, ks, "status"));
}

function renderRoadmap() {
  var box = document.getElementById("roadmap"); box.textContent = "";
  var rm = Array.isArray(D.roadmap) ? D.roadmap : [];
  if (!rm.length) { box.appendChild(el("div", { class: "vazio", text: "Sem roadmap neste mapa." })); return; }
  rm.forEach(function (r) {
    var card = el("div", { class: "rel" }, [el("h3", null, [el("span", { text: sv(r.release) })])]);
    if (r.situacao) card.appendChild(el("div", { class: "sit", text: r.situacao }));
    if (r.descricao) card.appendChild(el("p", { class: "desc", text: r.descricao }));
    var its = r.itens || [];
    if (!its.length) card.appendChild(el("div", { class: "vazio", text: "Nenhum item." }));
    its.forEach(function (x) {
      var d = el("div", { class: "it" }, [el("b", { text: sv(x.nome) })]);
      if (x.porque) d.appendChild(el("p", { text: x.porque }));
      var links = el("div");
      (x.issues || []).forEach(function (n) { links.appendChild(el("span", { class: "tag ac" }, [issueLink(n)])); });
      (x.branches || []).forEach(function (b) { links.appendChild(el("span", { class: "tag", text: b })); });
      if (x.origem) links.appendChild(el("span", { class: "tag", text: "origem: " + x.origem }));
      d.appendChild(links);
      card.appendChild(d);
    });
    box.appendChild(card);
  });
}

function renderListas() {
  var dec = document.getElementById("decisoes"); dec.textContent = "";
  (D.decisoes || []).forEach(function (x) {
    var d = el("div", null, [el("p", { class: "q", text: sv(x.pergunta) })]);
    if (x.recomendacao) d.appendChild(el("p", { class: "rec", text: "Recomendacao: " + x.recomendacao }));
    var l = el("div"); (x.issues || []).forEach(function (n) { l.appendChild(el("span", { class: "tag ac" }, [issueLink(n)])); }); d.appendChild(l);
    dec.appendChild(d);
  });
  if (!(D.decisoes || []).length) dec.appendChild(el("div", { class: "vazio", text: "Nenhuma decisao pendente." }));

  var fe = document.getElementById("fechar"); fe.textContent = "";
  (D.fechar_203 || []).forEach(function (x) {
    var it = BY[x.numero];
    var d = el("div", null, [el("div", null, [
      el("span", { class: "tag ac" }, [issueLink(x.numero)]),
      el("b", { text: " " + (it ? sv(it.titulo) : "") }),
      el("span", { class: "tag " + (x.confirmado ? "ok" : "warn"), text: x.confirmado ? "confirmado" : "nao confirmado" })
    ])]);
    if (x.resposta) d.appendChild(el("p", { text: "Resposta proposta: " + x.resposta }));
    if (x.confirmacao) d.appendChild(el("p", { class: "rec", text: "Confirmacao: " + x.confirmacao }));
    fe.appendChild(d);
  });
  if (!(D.fechar_203 || []).length) fe.appendChild(el("div", { class: "vazio", text: "Nada na lista." }));

  var nf = document.getElementById("naofechar"); nf.textContent = "";
  (D.nao_fechar_ainda || []).forEach(function (x) {
    var it = BY[x.numero];
    nf.appendChild(el("div", null, [
      el("div", null, [el("span", { class: "tag ac" }, [issueLink(x.numero)]), el("b", { text: " " + (it ? sv(it.titulo) : "") })]),
      el("p", { class: "rec", text: sv(x.motivo) })
    ]));
  });
  if (!(D.nao_fechar_ainda || []).length) nf.appendChild(el("div", { class: "vazio", text: "Nada na lista." }));
}

function renderTools() {
  var box = document.getElementById("tools"); box.textContent = "";
  var q = el("input", { type: "search", placeholder: "Buscar numero, titulo ou notas", value: F.q, "aria-label": "Buscar" });
  q.addEventListener("input", function () { F.q = q.value; renderTable(); });
  box.appendChild(q);
  function sel(campo, label, opts) {
    var s = el("select", { "aria-label": label }, [el("option", { value: "", text: label + ": todos" })]);
    opts.forEach(function (o) { s.appendChild(el("option", { value: o[0], text: o[1] })); });
    s.value = F[campo];
    s.addEventListener("change", function () { F[campo] = s.value; F.extra = ""; renderBars(); renderKpis(); renderTable(); });
    return s;
  }
  var ma = count(alvoDe), ms = count(function (i) { return sv(i.status); });
  box.appendChild(sel("estado", "GitHub", [["aberta", "aberta"], ["fechada", "fechada"]]));
  box.appendChild(sel("alvo", "Alvo", sortAlvos(Object.keys(ma)).map(function (k) { return [k, k + " (" + ma[k] + ")"]; })));
  box.appendChild(sel("status", "Status", Object.keys(ms).sort().map(function (k) { return [k, k + " (" + ms[k] + ")"]; })));
  box.appendChild(el("button", { class: "btn", type: "button", text: "Limpar", onclick: function () { F.q = F.plat = F.status = F.alvo = F.estado = F.extra = ""; renderAll(); } }));
  var chips = document.getElementById("chips"); chips.textContent = "";
  var mp = count(platDe);
  Object.keys(mp).sort(function (a, b) { return mp[b] - mp[a]; }).forEach(function (k) {
    chips.appendChild(el("button", { class: "chip" + (F.plat === k ? " on" : ""), type: "button", text: k + " " + mp[k], onclick: function () { F.plat = F.plat === k ? "" : k; renderTools(); renderBars(); renderTable(); } }));
  });
}

var COLS = [["numero", "#"], ["titulo", "Titulo"], ["estado_github", "GitHub"], ["plataforma", "Plataforma"], ["tipo", "Tipo"], ["status", "Status"], ["alvo", "Alvo"], ["release", "Release"], ["resp", "Resposta nossa"]];
function respTxt(i) { var r = i.ultima_resposta; if (!r) return "-"; return (r.nos ? "sim" : "nao") + (r.ultima_nossa ? " " + r.ultima_nossa : ""); }
function sortVal(i, k) {
  if (k === "numero") return i.numero || 0;
  if (k === "alvo") { var a = alvoDe(i), x = ALVO_ORDEM.indexOf(a); return a === SEM_ALVO ? 99 : (x < 0 ? 50 : x); }
  if (k === "resp") return respTxt(i);
  return sv(i[k]).toLowerCase();
}
function filtrar() {
  var q = F.q.trim().toLowerCase();
  var r = ITENS.filter(function (i) {
    if (F.estado && i.estado_github !== F.estado) return false;
    if (F.alvo && alvoDe(i) !== F.alvo) return false;
    if (F.status && sv(i.status) !== F.status) return false;
    if (F.plat && platDe(i) !== F.plat) return false;
    if (F.extra === "semresp" && !(aberta(i) && i.ultima_resposta && i.ultima_resposta.nos === false)) return false;
    if (q) {
      var hay = ("#" + i.numero + " " + sv(i.titulo) + " " + sv(i.notas)).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  r.sort(function (a, b) {
    var x = sortVal(a, F.sort), y = sortVal(b, F.sort);
    var c = x < y ? -1 : x > y ? 1 : 0;
    return (c || (a.numero - b.numero)) * F.dir;
  });
  return r;
}
var ABERTOS = {};
function renderTable() {
  var rows = filtrar();
  document.getElementById("cnt").textContent = rows.length + " de " + ITENS.length + " issues";
  var box = document.getElementById("tbl"); box.textContent = "";
  var tr = el("tr");
  COLS.forEach(function (c) {
    var th = el("th", { class: F.sort === c[0] ? "s" : "", text: c[1] + (F.sort === c[0] ? (F.dir > 0 ? " ▲" : " ▼") : ""), onclick: function () {
      if (F.sort === c[0]) F.dir = -F.dir; else { F.sort = c[0]; F.dir = c[0] === "numero" ? -1 : 1; }
      renderTable();
    } });
    tr.appendChild(th);
  });
  box.appendChild(el("thead", null, [tr]));
  var tb = el("tbody");
  rows.forEach(function (i) {
    var u = safeUrl(i.url);
    var numCell = el("td", { class: "num" }, [u ? el("a", { href: u, target: "_blank", rel: "noopener", text: "#" + i.numero, onclick: function (e) { e.stopPropagation(); } }) : el("span", { text: "#" + i.numero })]);
    var st = sv(i.status);
    var stCls = /lancada|consertada/.test(st) ? "ok" : /precisa-log|aberta/.test(st) ? "warn" : "";
    var row = el("tr", { class: "row" }, [
      numCell,
      el("td", { class: "tit", text: sv(i.titulo) }),
      el("td", null, [el("span", { class: "tag " + (aberta(i) ? "warn" : ""), text: sv(i.estado_github) })]),
      el("td", { text: sv(i.plataforma) }),
      el("td", { text: sv(i.tipo) }),
      el("td", null, [el("span", { class: "tag " + stCls, text: st })]),
      el("td", { text: alvoDe(i) === SEM_ALVO ? "-" : alvoDe(i) }),
      el("td", { text: sv(i.release) }),
      el("td", { text: respTxt(i) })
    ]);
    tb.appendChild(row);
    var det = null;
    row.addEventListener("click", function () {
      if (det) { det.remove(); det = null; delete ABERTOS[i.numero]; return; }
      det = detalhe(i); row.after(det); ABERTOS[i.numero] = 1;
    });
    if (ABERTOS[i.numero]) { det = detalhe(i); tb.appendChild(det); }
  });
  box.appendChild(tb);
  if (!rows.length) { /* tabela vazia: mensagem no contador */ }
}
function detalhe(i) {
  var dl = el("dl");
  function add(k, v) { if (v) { dl.appendChild(el("dt", { text: k })); dl.appendChild(el("dd", { text: v })); } }
  add("Notas", sv(i.notas));
  add("Proximo passo", sv(i.proximo_passo));
  add("Conserto", Array.isArray(i.conserto) ? i.conserto.join("\n") : sv(i.conserto));
  var r = i.ultima_resposta;
  if (r) add("Ultima resposta", "ultimo comentario por " + sv(r.ultimo_comentario_por) + " em " + sv(r.data) + "; ultima nossa: " + sv(r.ultima_nossa || "nunca"));
  add("Criada em", sv(i.criada_em));
  if (!dl.childNodes.length) add("Detalhes", "(sem notas)");
  return el("tr", { class: "det" }, [el("td", { colspan: String(COLS.length) }, [dl])]);
}

function renderAll() { renderKpis(); renderBars(); renderTools(); renderTable(); }

// AUDITORIA: quem validou o que, em que ref, com que resultado e onde esta a
// prova (validacoes em mapa.json; ver docs/issues/MAPA.md, "Como atualizar").
var RES_TAG = { passou: "ok", falhou: "bad", inconclusivo: "warn", "nao-reproduziu": "warn", pendente: "" };
function renderAuditoria() {
  var box = document.getElementById("auditoria"); box.textContent = "";
  var vs = (Array.isArray(D.validacoes) ? D.validacoes : []).slice().sort(function (a, b) { return sv(b.data).localeCompare(sv(a.data)); });
  if (!vs.length) { box.appendChild(el("div", { class: "vazio", text: "Nenhuma validacao registrada." })); return; }
  var cont = {}; vs.forEach(function (v) { cont[v.resultado] = (cont[v.resultado] || 0) + 1; });
  box.appendChild(el("div", { class: "cnt", text: vs.length + " validacoes: " + Object.keys(cont).map(function (k) { return cont[k] + " " + k; }).join(", ") }));
  var t = el("table");
  t.appendChild(el("tr", null, ["Data", "Quem", "O que", "Issues", "Ref", "Resultado", "Evidencia"].map(function (h) { return el("th", { text: h }); })));
  vs.forEach(function (v) {
    var iss = el("td"); (v.issues || []).forEach(function (n) { iss.appendChild(el("span", { class: "tag ac" }, [issueLink(n)])); });
    t.appendChild(el("tr", null, [
      el("td", { text: sv(v.data) }), el("td", { text: sv(v.quem) }), el("td", { text: sv(v.o_que) }), iss,
      el("td", { text: sv(v.ref) }),
      el("td", null, [el("span", { class: "tag " + (RES_TAG[v.resultado] || ""), text: sv(v.resultado) })]),
      el("td", { text: sv(v.evidencia) })
    ]));
  });
  box.appendChild(el("div", { class: "scroll" }, [t]));
}
function renderFora() {
  var box = document.getElementById("fora"); box.textContent = "";
  var fs = Array.isArray(D.fora_do_github) ? D.fora_do_github : [];
  if (!fs.length) { box.appendChild(el("div", { class: "vazio", text: "Nada fora do GitHub." })); return; }
  fs.slice().reverse().forEach(function (o) {
    var d = el("div", { class: "it" }, [el("b", { text: sv(o.titulo) })]);
    var tags = el("div");
    [o.plataforma, o.status, o.release && o.release !== "-" ? "release " + o.release : ""].forEach(function (x) { if (x) tags.appendChild(el("span", { class: "tag", text: x })); });
    d.appendChild(tags);
    if (o.proximo_passo) d.appendChild(el("p", { class: "rec", text: "Proximo passo: " + o.proximo_passo }));
    if (o.notas) d.appendChild(el("p", { text: o.notas }));
    if ((o.conserto || []).length) d.appendChild(el("p", { text: "Conserto: " + o.conserto.join("; ") }));
    box.appendChild(d);
  });
}

function init(d) {
  D = d; ITENS = Array.isArray(d.itens) ? d.itens : [];
  ITENS.forEach(function (i) { BY[i.numero] = i; });
  var m = d.meta || {};
  var partes = [];
  if (m.commit) partes.push("commit " + m.commit + (m.assunto ? " - " + m.assunto : ""));
  if (m.branch) partes.push("branch " + m.branch);
  if (m.mapa_atualizado_em) partes.push("mapa de " + m.mapa_atualizado_em);
  if (m.gerado_em) partes.push("gerado em " + m.gerado_em.replace("T", " ").slice(0, 19));
  document.getElementById("meta").textContent = partes.join("  |  ") || "sem metadados";

  var app = document.getElementById("app");
  function sec(titulo, id, cls) { app.appendChild(el("h2", { text: titulo })); var b = el("div", { id: id, class: cls || "" }); app.appendChild(b); return b; }
  sec("Resumo", "kpis", "kpis");
  sec("Distribuicao", "bars", "grid2");
  sec("Roadmap por release", "roadmap", "cards");
  app.appendChild(el("h2", { text: "Decisoes pendentes" })); app.appendChild(el("div", { id: "decisoes", class: "panel lst" }));
  app.appendChild(el("div", { class: "grid2" }, [
    el("div", null, [el("h2", { text: "Fechar com a 2.0.3" }), el("div", { id: "fechar", class: "panel lst" })]),
    el("div", null, [el("h2", { text: "Nao fechar ainda" }), el("div", { id: "naofechar", class: "panel lst" })])
  ]));
  app.appendChild(el("h2", { text: "Auditoria de validacoes" })); app.appendChild(el("div", { id: "auditoria" }));
  app.appendChild(el("h2", { text: "Fora do GitHub (Reddit e outros)" })); app.appendChild(el("div", { id: "fora", class: "panel lst" }));
  app.appendChild(el("h2", { id: "tabela", text: "Todas as issues" }));
  app.appendChild(el("div", { id: "tools", class: "tools" }));
  app.appendChild(el("div", { id: "chips", class: "tools" }));
  app.appendChild(el("div", { id: "cnt", class: "cnt" }));
  app.appendChild(el("div", { class: "scroll" }, [el("table", { id: "tbl" })]));
  renderAll(); renderRoadmap(); renderListas(); renderAuditoria(); renderFora();
}

fetch("data.json", { cache: "no-store" }).then(function (r) {
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}).then(init).catch(function (e) {
  document.getElementById("meta").textContent = "Erro ao carregar data.json: " + e.message + " (rode gerar.py e sirva a pasta site/ por HTTP)";
});
</script>
